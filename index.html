<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05060a" />
    <meta name="description" content="MoonClaw — explore an interactive 3D Moon built from NASA LRO imagery. Rotate, zoom, and visit famous landmarks like the Apollo 11 landing site and Tycho crater." />
    <title>MoonClaw — Interactive 3D Moon</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/textures/moon_color_2k.jpg" as="image" />
  </head>
  <body>
    <a class="skip-link" href="#landmark-list">Skip to landmarks</a>

    <main id="app" aria-labelledby="site-title">
      <div
        id="scene"
        class="scene"
        role="application"
        aria-roledescription="3D Moon viewer"
        aria-label="Interactive 3D Moon. Drag to rotate, scroll or pinch to zoom. Keyboard: arrow keys rotate, plus and minus zoom, R resets the view."
        tabindex="0"
      ></div>

      <!-- Landmark pins are rendered here, positioned over the 3D scene -->
      <div id="markers" class="markers"></div>

      <!-- Shown when WebGL is unavailable -->
      <figure id="fallback" class="fallback" hidden>
        <img
          src="/textures/moon_fallback.jpg"
          alt="Image of the near side of the Moon, showing its dark maria and bright cratered highlands."
          width="900"
          height="900"
        />
        <figcaption>
          Your device or browser can’t display the interactive 3D Moon (WebGL is unavailable),
          so here’s a still image instead. You can still read about each landmark below.
        </figcaption>
      </figure>

      <header class="hud hud-top">
        <h1 id="site-title" class="brand">Moon<span>Claw</span></h1>
        <p class="tagline">An interactive 3D Moon</p>
      </header>

      <nav class="panel" aria-labelledby="landmarks-heading">
        <button
          id="panel-toggle"
          class="panel-toggle"
          type="button"
          aria-expanded="true"
          aria-controls="landmark-list"
        >
          <span id="landmarks-heading">Landmarks</span>
          <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <ul id="landmark-list" class="landmark-list" tabindex="-1"></ul>
      </nav>

      <div class="controls" role="toolbar" aria-label="View controls">
        <button id="zoom-in" type="button" class="ctrl" aria-label="Zoom in" title="Zoom in (+)">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button id="zoom-out" type="button" class="ctrl" aria-label="Zoom out" title="Zoom out (−)">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
        </button>
        <button id="auto-rotate" type="button" class="ctrl" aria-pressed="false" aria-label="Auto-rotate" title="Toggle auto-rotate (A)">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
        </button>
        <button id="reset-view" type="button" class="ctrl ctrl-wide" aria-label="Reset view" title="Reset view (R)">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg>
          <span>Reset view</span>
        </button>
      </div>

      <p class="hint" id="hint" aria-hidden="true">Drag to rotate · Scroll or pinch to zoom · Tap a pin</p>

      <section
        id="info-card"
        class="info-card"
        role="dialog"
        aria-modal="false"
        aria-labelledby="info-title"
        hidden
      >
        <button id="info-close" type="button" class="info-close" aria-label="Close landmark info">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <p class="info-kicker" id="info-kicker"></p>
        <h2 id="info-title"></h2>
        <p class="info-coords" id="info-coords"></p>
        <p id="info-body"></p>
        <dl class="info-facts" id="info-facts"></dl>
      </section>

      <div id="loader" class="loader" role="status" aria-live="polite">
        <div class="loader-ring" aria-hidden="true"></div>
        <span>Loading the Moon…</span>
      </div>

      <p id="live" class="visually-hidden" aria-live="polite"></p>

      <footer class="credit">
        Imagery: <a href="https://svs.gsfc.nasa.gov/4720" target="_blank" rel="noopener">NASA SVS CGI Moon Kit</a> (LRO/LROC &amp; LOLA)
      </footer>
    </main>

    <noscript>
      <div class="noscript">
        <img src="/textures/moon_fallback.jpg" alt="Image of the near side of the Moon." width="900" height="900" />
        <p>MoonClaw needs JavaScript for the interactive 3D view.</p>
      </div>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
